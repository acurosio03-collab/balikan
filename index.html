<!DOCTYPE html>
<html>
<head>

<title>Aku Mau Balikan ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
display:flex;
justify-content:center;
align-items:center;

}


/* tombol mulai */

#mulai{

background:white;
color:#ff3864;
border:none;
padding:20px 40px;
border-radius:50px;
font-size:25px;
font-weight:bold;
cursor:pointer;

}



/* countdown */

#countdown{

display:none;
font-size:120px;
color:white;
font-weight:bold;
animation:zoom .8s;

}


@keyframes zoom{

0%{
transform:scale(0);
}

50%{
transform:scale(1.4);
}

100%{
transform:scale(1);
}

}



/* kartu */


.card{

display:none;
background:white;
width:360px;
padding:30px;
border-radius:30px;
text-align:center;
box-shadow:0 0 40px #ff3864;
animation:muncul 1s;

}



@keyframes muncul{

from{
transform:scale(0) rotate(180deg);
}

to{
transform:scale(1);
}

}



.cat{

font-size:80px;
animation:goyang 1s infinite;

}


@keyframes goyang{

50%{
transform:rotate(10deg);
}

}



h1{

color:#ff3864;

}


p{

margin:20px;
color:#555;

}



button{

border:none;
padding:13px 35px;
border-radius:40px;
font-size:18px;
cursor:pointer;
margin:10px;

}



#yes{

background:#ff3864;
color:white;

}



#no{

background:#333;
color:white;
position:absolute;

}



#hasil{

display:none;
color:#ff3864;
font-size:22px;
font-weight:bold;
margin-top:20px;

}




/* popup */

#popupLove{

display:none;
position:fixed;
inset:0;
background:rgba(255,50,120,.8);
z-index:99;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
color:white;
font-size:35px;
font-weight:bold;

}


#popupLove span{

font-size:90px;
animation:loncat .8s infinite alternate;

}


@keyframes loncat{

to{
transform:scale(1.3);
}

}



/* efek */

.love{

position:absolute;
font-size:30px;
animation:naik 4s linear;

}


@keyframes naik{

from{

transform:translateY(100vh);

}

to{

transform:translateY(-100vh);
opacity:0;

}

}



.confetti{

position:absolute;
font-size:30px;
animation:jatuh 3s linear;

}



@keyframes jatuh{

from{

transform:translateY(-100px) rotate(0);

}

to{

transform:translateY(100vh) rotate(720deg);
}

}


</style>

</head>


<body>



<button id="mulai">
Mulai ❤️
</button>



<div id="countdown">
3
</div>



<div class="card" id="card">


<div class="cat">
🐱❤️
</div>


<h1>
Aku Kangen Kamu
</h1>


<p>

Aku masih sayang kamu...

<br><br>

Maukah kita mulai lagi?

🥺❤️

</p>



<button id="yes">
YES ❤️
</button>


<button id="no">
NO 😭
</button>



<div id="hasil">

Terima kasih sudah kembali ❤️

</div>


</div>



<div id="popupLove">

<span>
❤️
</span>

DIA MAU BALIKAN 😭❤️

<br>

Mulai cerita baru lagi...

</div>



<audio id="musik" loop>

<source id="lagu" src="satubulan.mp3">

</audio>




<script>


const musik=document.getElementById("musik");

const lagu=document.getElementById("lagu");



function gantiLagu(nama){

musik.pause();

lagu.src=nama;

musik.load();

musik.play();

}




// mulai

document.getElementById("mulai").onclick=function(){


musik.play();


document.getElementById("mulai").style.display="none";


mulaiCountdown();


};





function mulaiCountdown(){


let angka=3;


let count=document.getElementById("countdown");


count.style.display="block";


count.innerHTML=angka;



let timer=setInterval(()=>{


angka--;


if(angka>0){

count.innerHTML=angka;

}


else{


clearInterval(timer);


count.style.display="none";


document.getElementById("card").style.display="block";


// lagu bunga maaf

gantiLagu("bunga.mp3");


}



},1000);



}






// NO kabur


let no=document.getElementById("no");


no.addEventListener("mouseover",()=>{


no.style.left=Math.random()*(innerWidth-100)+"px";


no.style.top=Math.random()*(innerHeight-50)+"px";


});






// YES


document.getElementById("yes").onclick=function(){


gantiLagu("melukis.mp3");


document.getElementById("hasil").style.display="block";


document.getElementById("popupLove").style.display="flex";



for(let i=0;i<50;i++){

buatConfetti();

}



};






function buatLove(){


let love=document.createElement("div");


love.className="love";


love.innerHTML="❤️";


love.style.left=Math.random()*100+"%";


document.body.appendChild(love);


setTimeout(()=>{

love.remove();

},4000);


}





function buatConfetti(){


let c=document.createElement("div");


c.className="confetti";


let emoji=["❤️","💖","✨","🌸","💕","🎉"];


c.innerHTML=emoji[Math.floor(Math.random()*emoji.length)];


c.style.left=Math.random()*100+"%";


document.body.appendChild(c);


setTimeout(()=>{

c.remove();

},3000);


}



setInterval(buatLove,500);



</script>


</body>
</html>
